# Render Blueprint — WordPress on Render + MySQL on Railway
# Repo: https://github.com/ankitdev597/wordpress-elementor.git
# Site: https://wordpress-elementor.onrender.com
#
# Set WORDPRESS_DB_PASSWORD once in Render Dashboard (Variables → sync).
# Do not commit the Railway password to git.

services:
  - type: web
    name: wordpress-elementor
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    # Static file, so a WordPress canonical redirect can never fail the check
    healthCheckPath: /render-health.txt
    disk:
      name: wordpress-data
      mountPath: /var/www/html
      sizeGB: 10
    envVars:
      - key: PORT
        value: "10000"
      # Railway public MySQL (host:port — WordPress needs the port in DB_HOST)
      - key: WORDPRESS_DB_HOST
        value: sakura.proxy.rlwy.net:32478
      - key: WORDPRESS_DB_PORT
        value: "32478"
      - key: WORDPRESS_DB_NAME
        value: railway
      - key: WORDPRESS_DB_USER
        value: root
      # Paste Railway MySQL password in Render Dashboard for this key
      - key: WORDPRESS_DB_PASSWORD
        sync: false
      - key: WORDPRESS_TABLE_PREFIX
        value: wp_
      - key: WORDPRESS_SITE_URL
        value: https://wordpress-elementor.onrender.com
      - key: WORDPRESS_CONFIG_EXTRA
        value: |
          if ( isset( $_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
              $_SERVER['HTTPS'] = 'on';
          }
          define( 'WP_HOME', 'https://wordpress-elementor.onrender.com' );
          define( 'WP_SITEURL', 'https://wordpress-elementor.onrender.com' );
