# Render Blueprint — push to GitHub → auto deploy WordPress + MySQL
# Dashboard: Blueprints → New Blueprint Instance → select this repo
# Do NOT point DB at Railway/external hosts; MySQL is created and linked here.

services:
  - type: web
    name: wordpress-elementor
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /
    disk:
      name: wordpress-data
      mountPath: /var/www/html
      sizeGB: 10
    envVars:
      # Render routes public HTTP to this port; entrypoint configures Apache for it
      - key: PORT
        value: "10000"
      - key: WORDPRESS_DB_HOST
        fromService:
          name: mysql-wordpress
          type: pserv
          property: host
      - key: WORDPRESS_DB_PORT
        value: "3306"
      - key: WORDPRESS_DB_NAME
        fromService:
          name: mysql-wordpress
          type: pserv
          envVarKey: MYSQL_DATABASE
      - key: WORDPRESS_DB_USER
        fromService:
          name: mysql-wordpress
          type: pserv
          envVarKey: MYSQL_USER
      - key: WORDPRESS_DB_PASSWORD
        fromService:
          name: mysql-wordpress
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: WORDPRESS_TABLE_PREFIX
        value: wp_
      # Fixed production URL (also used after SQL import for siteurl/home)
      - key: WORDPRESS_SITE_URL
        value: https://wordpress-elementor.onrender.com
      - key: WORDPRESS_CONFIG_EXTRA
        value: |
          if ( isset( $_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
              $_SERVER['HTTPS'] = 'on';
          }
          define( 'WP_HOME', 'https://wordpress-elementor.onrender.com' );
          define( 'WP_SITEURL', 'https://wordpress-elementor.onrender.com' );

  - type: pserv
    name: mysql-wordpress
    runtime: docker
    plan: starter
    region: oregon
    repo: https://github.com/render-examples/mysql.git
    branch: master
    autoDeployTrigger: "off"
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: usnews_wordpress
      - key: MYSQL_USER
        value: wordpress
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
